[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gdrive-data-hub"
version = "1.0.0"
description = "Hybrid LAN NAS and Google Drive Continuous Data Governance Hub"
readme = "README.md"
authors = [{ name = "yzscmsg" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
portal = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "jinja2>=3.1.0",
    "requests>=2.31.0"
]
dev = [
    "pytest>=7.4.0"
]

[project.scripts]
gdrive-hub = "hub.cli:main"
